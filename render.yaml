# Render Blueprint：仓库连到 Render 后会自动读这个文件
# 免费实例会在 15 分钟无访问后休眠，首次访问要等几十秒；付费实例不会。
services:
  - type: web
    name: resume-reviewer
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      # 不要在这里写 PORT：Render 会注入自己的 PORT 并用它转发流量，
      # 覆盖成 8080 会让平台的健康检查一直连不上（表现为 502）。
      #
      # 站长自己的 key 不再配置在服务里：v1.9 起网页只用「访客自己填的 key」或
      # 「零成本的规则引擎」，服务器 key 永远不会被代用。想用命令行批量跑评审，
      # 只在你本机的 .env 里配 DSH_LLM_API_KEY 即可，不需要上 Render。
      - key: DSH_LLM_MODEL
        value: deepseek-flash
      - key: DSH_LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DSH_LLM_THINKING
        value: "off"
      - key: DSH_LLM_TIMEOUT
        value: "300"
      # 想允许访客在页面上填本机/内网模型地址（如自建 Ollama 隧道）再把这项设为 "1"；
      # 默认不设，内网地址一律拒绝。
      # - key: DSH_LLM_ALLOW_LOCAL
      #   value: "1"
      - key: REPORTS_DIR
        value: /tmp/reports
      # 留存策略：公网版写 ephemeral —— 报告与历史只活在当前进程，重启即清空。
      # 理由：免费实例的 /tmp 本来就是临时的，重启就丢；页面若还挂着「历史记录」，
      # 用户会以为下周还能找回。宁可当场说清楚，也别替宿主机撒谎。
      - key: RETENTION_NOTICE
        value: ephemeral
      - key: RATE_PER_HOUR
        value: "20"
      - key: DAILY_LIMIT
        value: "300"
