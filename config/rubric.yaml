# ============================================================================
# resume-reviewer 评分规范（rubric）· 单一真源
# ============================================================================
# 为什么有这个文件：
#   v1.x 里这些数字散在 7 个 .py 文件里，prompt 又各写一遍。改一个阈值要改
#   三处（代码 / prompt 模板 / JSON Schema），漏一处就出现「prompt 说 60 字、
#   脚本按 40 字判」这类自伤，v1.8 之前踩过两次。
#   v2.0 起：**这里改，代码读这里，测试校验 prompt/Schema 与这里一致**。
#
# 只读约定：
#   - 由 scripts/rubric.py 解析（零依赖，仅支持本文件用到的 YAML 子集：
#     两级以上嵌套映射、整数/浮点/布尔/字符串、行内列表 [a, b]、# 注释）。
#   - 不支持多行字符串、锚点、标签。要加新结构请先扩 rubric.py 并补测试。
#   - 改任何数字后必须跑：python scripts/run_tests.py --suite rubric
#     （会检查 prompt 模板与 JSON Schema 里的同一数字是否一致）
# ============================================================================

# 规范版本：与 prompt 版本绑定。改了阈值就要动这个号，报告里会写出来。
version: v1.8
prompt_version: v1.8

# ---------------------------------------------------------------------------
# 检验 1 · 格式（v1.6 起排在第一位：格式塌了，内容再好也看不见）
# ---------------------------------------------------------------------------
format:
  # 一页 A4 大致能放多少字；超过约两页字数就提示「可能超页」
  # 取值依据：中文简历一页（含项目/实习）实测 800~1100 字
  pages_chars: 900

# ---------------------------------------------------------------------------
# 检验 2 · 可读性（长句、弱动词行）
# ---------------------------------------------------------------------------
readability:
  # 单句超过多少字算「长句」。80% 的合格 bullet 在 40~60 字，取 60 为阈值
  # ⚠️ prompt「检验 2」里必须出现同一个数字
  long_sentence_chars: 60
  # 一行以「参与/负责/协助…」开头时，动词后面至少还要有这么多实字，
  # 才当成一行真正的经历（否则「完成」两个字也被判成经历行，v1.10 误报源）
  weak_line_min_rest: 4

# ---------------------------------------------------------------------------
# 检验 3 · 证据质量（引用必须逐字出自原文）
# ---------------------------------------------------------------------------
evidence:
  # 引用的最短长度：太短（如「负责」）无法证明回指原文，也给不出可操作建议
  min_quote: 6
  # 引用的最长长度：超过这个长度就不像「引用」而像「复述」，且校验会被绕开
  max_quote: 200
  # 判断「结果是否被埋在句尾」时只看句首多少个字
  head_chars: 12

# ---------------------------------------------------------------------------
# 两道关 · 判定阈值（gate 的结果是推导出来的，不允许模型自由填）
# ---------------------------------------------------------------------------
gates:
  # 第一关 · HR 初筛
  hr:
    # 岗位匹配度 <3 直接不过（5 分制）
    role_fit_min: 3
    # 结果与量化 <2 直接不过
    impact_min: 2
  # 第二关 · 业务面试官
  interview:
    # 证据质量 <3 直接不过
    evidence_quality_min: 3
    # 高风险项（权属升级 / 编造数字 / 不可追问）允许的最大条数
    high_risk_max: 1

# ---------------------------------------------------------------------------
# 结论分档（verdict 由总分推导，不允许模型自由填）
# ---------------------------------------------------------------------------
verdict:
  # 依次判断：先看是否 >= strong_pass_min，再看 pass_min，再看 borderline_min
  # 低于 borderline_min 一律 reject
  strong_pass_min: 80
  pass_min: 65
  borderline_min: 50

# ---------------------------------------------------------------------------
# 分数段锚点（v2.3 D2）
# ---------------------------------------------------------------------------
# 为什么要有这一节：
#   只有一条「≥80 强推、65~79 可投」的阈值线，模型仍然不知道该给 71 还是 78。
#   实测里最常见的毛病是**全挤在 68~72**：用户看不出自己离下一档还差什么。
#   这里给每一段一句「长什么样」，让模型先定段、再定段内的具体分数。
#
# 约定：
#   - 段必须连续、无空隙、无重叠，且 0~100 全覆盖（测试逐段断言）
#   - **每段必须完整落在同一个 verdict 区间内，不许跨阈值**
#     （把 pass_min 从 65 改成 70 而忘了改这里，测试会红——两套分档漂移是
#       最隐蔽的一种错：分数看着合理，结论标签却是隔壁那段）
#   - 每段的 suggest 是「这一段里最常见的分数」，不是硬性要求
# ---------------------------------------------------------------------------
bands:
  top:
    label: 90-100 · 强推
    min: 90
    max: 100
    suggest: 93
    feature: 每段经历都对上 JD 核心职责，结果有口径、有归因，一眼能复述出「这人做过什么」
    typical: 有 2~3 条带口径的结果指标（说清了基线与怎么算的）｜主线清晰，亮点能经得起三层追问
    misjudge: 把「学校好/公司大」当竞争力信号；或把内容堆满却没有一条能对上 JD
  strong:
    label: 80-89 · 可投
    min: 80
    max: 89
    suggest: 84
    feature: 岗位对口且证据扎实，个别 bullet 弱一点，改一小时就能到强推
    typical: 关键经历有数字但口径不全（如只有「提升 20%」没说从多少到多少）｜分区完整、无自评词
    misjudge: 把"能改好"当成"已经好"，直接给到 90+；或因为一处小毛病整体压到 70 段
  pass:
    label: 65-79 · 可投（有短板）
    min: 65
    max: 79
    suggest: 72
    feature: 内容和 JD 对得上，但「结果、方法、边界」里缺一样，面试会被追问到卡壳
    typical: 有结果但无数字，或数字只有工作量（「整理 300 条反馈」）｜弱动词行 ≤2 处
    misjudge: 这是最容易被塞满的一段。若说不出「为什么不是 64、也不是 80」，就不该停在这里
  borderline:
    label: 50-64 · 勉强
    min: 50
    max: 64
    suggest: 57
    feature: 能看出做过相关的事，但通篇「参与/负责」，看不出贡献边界
    typical: 分区不全或弱动词满篇｜引用里找不到一条能证明能力的原始证据
    misjudge: 因为「有实习经历」就默认及格；经历本身不是证据，写清楚才是
  reject:
    label: 0-49 · 不建议投
    min: 0
    max: 49
    suggest: 41
    feature: 岗位基本不相关，或格式塌到看不见内容（图片化文字、双栏、表格）
    typical: 技能与 JD 无关｜无一处分区｜无法从文字里提取联系方式
    misjudge: 把「投错岗」判成「人不行」——报告里必须说清是岗位不匹配，不是能力否定

# ---------------------------------------------------------------------------
# 五维分别量什么（v2.3 新增：给人看的说明，写在这里是为了与权重同源，
# 免得 UI、文档、prompt 各写一份说法）
# ---------------------------------------------------------------------------
dimensions:
  role_fit: 岗位匹配度（经历是否对上 JD 的核心职责，而不是「专业名字像不像」）
  impact: 结果与量化（是否说清结果、口径、归因，而不是只列做了什么）
  evidence_quality: 证据质量（每条结论能否回指原文与原始出处，而不是自评）
  structure: 结构与排版（分区、顺序、一页可读、机器可解析，而不是花哨）
  competitiveness: 差异化竞争力（同岗人群里是否记得住，而不是堆砌荣誉）

# ---------------------------------------------------------------------------
# 五维权重（合计必须 = 100，测试会断言）
# ---------------------------------------------------------------------------
weights:
  role_fit: 25
  impact: 25
  evidence_quality: 20
  structure: 15
  competitiveness: 15

# ---------------------------------------------------------------------------
# 行业权重映射（v2.3 D1）
# ---------------------------------------------------------------------------
# 为什么要有这一节：
#   `weights:` 是唯一一套权重，意味着投国企和投互联网拿同一把尺。同一个人的
#   简历，「量化成果」在互联网是加分项，在体制内根本不是考察点；两边按同一
#   权重算，等于系统性误判。这里给每个行业一套权重 + 一句「看重什么」。
#   用户不选行业时用 default，行为与 v2.2 完全一致（不动老结果）。
#
# 约定：
#   - key 必须是 ASCII（解析器只认 [A-Za-z_][A-Za-z0-9_]*），中文名放 label
#   - 每个行业的五维权重合计必须 100，测试会逐个断言
#   - 改完跑 python scripts/run_tests.py --suite rubric
# ---------------------------------------------------------------------------
industries:
  default:
    label: 通用（不指定行业）
    emphasis: 五维通用标准，不看行业偏好
    weights:
      role_fit: 25
      impact: 25
      evidence_quality: 20
      structure: 15
      competitiveness: 15
  tech:
    label: 互联网/科技
    emphasis: 项目影响力、技术关键词、GitHub、量化产出
    weights:
      role_fit: 25
      impact: 28
      evidence_quality: 20
      structure: 12
      competitiveness: 15
  finance:
    label: 金融/银行
    emphasis: 学历与资质、证书（CFA/FRM/CPA）、合规意识、稳定性
    weights:
      role_fit: 30
      impact: 18
      evidence_quality: 22
      structure: 15
      competitiveness: 15
  soe:
    label: 国企/体制内
    emphasis: 学历层次、专业对口、学生干部与党团经历、稳定性
    weights:
      role_fit: 32
      impact: 15
      evidence_quality: 20
      structure: 18
      competitiveness: 15
  design:
    label: 设计/创意
    emphasis: 作品集链接、审美与排版、工具链、项目类型跨度
    weights:
      role_fit: 22
      impact: 18
      evidence_quality: 18
      structure: 27
      competitiveness: 15
  product:
    label: 产品/运营
    emphasis: 数据驱动（DAU/留存/GMV）、从 0 到 1、方法论
    weights:
      role_fit: 25
      impact: 28
      evidence_quality: 20
      structure: 12
      competitiveness: 15
  education:
    label: 教育/培训
    emphasis: 学历与教师资格、教学成果数据、课程研发
    weights:
      role_fit: 30
      impact: 22
      evidence_quality: 18
      structure: 15
      competitiveness: 15
  medical:
    label: 医疗/医药
    emphasis: 学历与执业资格、规培与论文、临床或科研数据
    weights:
      role_fit: 32
      impact: 20
      evidence_quality: 20
      structure: 13
      competitiveness: 15
  game:
    label: 游戏
    emphasis: 上线项目、引擎熟练度、品类理解
    weights:
      role_fit: 25
      impact: 26
      evidence_quality: 22
      structure: 12
      competitiveness: 15
  retail:
    label: 零售/电商
    emphasis: GMV/SKU/转化率等运营数据、平台规则、活动策划
    weights:
      role_fit: 25
      impact: 30
      evidence_quality: 18
      structure: 12
      competitiveness: 15
  gov:
    label: 政府/非营利
    emphasis: 公文写作、政策理解、基层服务、组织协调
    weights:
      role_fit: 32
      impact: 14
      evidence_quality: 20
      structure: 19
      competitiveness: 15

# ---------------------------------------------------------------------------
# 输出契约里由代码强制的条数限制
# （JSON Schema 的 minItems/maxItems 必须与这里一致，测试会断言）
# ---------------------------------------------------------------------------
output:
  # 至少 2 条改写：1 条不足以给出「换一种改法」的余地，用户会以为只有唯一解
  rewrites_min: 2
  # 最多 6 条：报告要一页可读，再多用户不会看
  rewrites_max: 6

# ---------------------------------------------------------------------------
# 改版前后对比（v1.9 的 D1）
# ---------------------------------------------------------------------------
version_diff:
  # 低于这个相似度就不认为是同一份简历的另一版，宁可不比
  # 依据：同版不同稿实测 0.72~0.95；不相干简历 0.1~0.45；取 0.62 作分界
  min_similarity: 0.62
  # 一次最多比对多少个历史版本（每次都要读 .txt，不能无限翻）
  max_candidates: 40
  # 返回给前端的差异行上限（统计数字仍保留真实值）
  max_diff_items: 200
  # 判断「这段文字还在不在」的最短探针长度，太短没区分度
  min_probe: 8

# ---------------------------------------------------------------------------
# 输入识别（PDF / 图片 / Word）
# ---------------------------------------------------------------------------
ingest:
  # 抽取出的文本少于这么多字，判定为「可能是扫描件/空白页」，需要走视觉转写
  min_text_chars: 120

# ---------------------------------------------------------------------------
# 低信息简历（v2.4 新增：字太少不硬拒，但也不假装能评分）
# ---------------------------------------------------------------------------
# 为什么不是「一律拒收」：实际收到的「简历」有两类——一份是真空白的垃圾，
# 另一份是学生只写了个草稿（学校+专业+一段社团）。对第二类回一句「至少 80 字」
# 是最没用的回答：他不知道自己缺的是「结果」而不是「字数」。
thin:
  # 低于这个字数连「结构建议」都没法给：没有岗位、没有经历、没有技能可谈
  min_chars: 40
  # 40~advisory_max 字走「建议模式」：不给分，只指出缺什么、先补哪几条、按什么结构写。
  # 依据：一段真实实习（岗位 + 动作 + 结果）最低约 60~80 字，加教育/技能约 120；
  # 不到 120 字时，五维里至少两维没有证据，分数误差会盖过分数本身的差别。
  advisory_max: 120
  # 建议模式最多问几个问题。超过 4 个用户不会答（等于没问），少于 3 个信息不够定位
  max_questions: 4

# ---------------------------------------------------------------------------
# 招聘系统（ATS）· 视觉项清单 + 平台层清单（v2.5 D5）
# ---------------------------------------------------------------------------
# 为什么要有这一节：
#   简历被谁读，决定它该怎么写。国内校招主流是「先过系统、再被人看」——北森、
#   Moka、智联、前程无忧各有一套解析规则；同一份 PDF，在 A 平台能拆成四段经历，
#   在 B 平台可能并成一段。这些差异不写下来，用户只能靠猜。
#
# 但必须说清边界（这也是这一节唯一敢承诺的事）：
#   - 这些是公开信息 + 实测经验的总结，**不是任何平台的官方文档**；
#   - 平台规则会变，解析结果还与文件本身（字体、表格、图片）强相关；
#   - 所以平台层只回答「去检查什么」，**绝不写「一定会被淘汰」这种断言**；
#     判不出来的标 unknown，不许算成 ok，也不许算成不合格。
#
# 约定：
#   - checks 的 key 必须带探针前缀，前缀决定这条能不能从正文判：
#     dates_ / sections_ / contact_ / keywords_ / length_  → 正文可判
#     layout_ / form_ / filename_                          → 正文判不出，只能提醒人工核
#     （加了条目却没人判 = 骗人，所以前缀不认识就直接抛错）
#   - visual_items 是「有截图时必须逐项判满」的固定 10 项，blocking_items 是
#     其中「一项不 ok 就直接 blocking」的致命项。**这两份清单是唯一真源**：
#     check_output.py 从这里读，测试断言 prompt 的表格与这里逐字一致。
# ---------------------------------------------------------------------------
ats:
  visual_items: [图片化文字, 分栏或表格, 字号与行距, 留白密度, 是否超出1页, 照片占位, 页眉页脚占用, 对齐与间距一致, 章节命名标准, 联系方式可提取]
  blocking_items: [图片化文字, 分栏或表格, 是否超出1页, 章节命名标准, 联系方式可提取]
  platforms:
    beisen:
      label: 北森（校招/国企主流）
      note: 先解析成字段再人工筛，段落缺起止年月会被并成一段
      checks:
        dates_range: 每段经历都写起止年月（2024.09—2025.06），别只写「2024」
        sections_std: 用「教育经历 / 实习经历 / 项目经历 / 技能」四个标准标题
        contact_top: 手机和邮箱写在正文第一屏，别塞进页眉或图片
        layout_single: 单栏排版，不用表格分栏
    moka:
      label: Moka（互联网/中型公司主流）
      note: 强依赖标准章节名分组，自定义标题会掉进「其他」
      checks:
        sections_std: 段落标题用标准名，「我的经历」「关于我」会被归到其他
        dates_range: 起止年月完整，缺了整段可能识别不出
        keywords_role: 岗位关键词写进正文，别只写在「自我评价」里
        layout_single: 单栏排版
    zhaopin:
      label: 智联招聘
      note: 平台内是表单字段，上传附件只作补充，筛选看表单
      checks:
        form_fill: 平台内表单逐项单独填满，别只传附件
        form_consistent: 表单与附件写一致（时间/公司名/岗位名差一个字就对不上）
        keywords_role: 岗位关键词在正文与表单里都出现
    job51:
      label: 前程无忧
      note: 以关键词检索为主，附件解析容错低
      checks:
        keywords_role: 岗位关键词出现在正文，别指望系统认同义词
        contact_top: 手机和邮箱在正文里可直接复制
        layout_single: 单栏，避开表格与文本框
    shixiseng:
      label: 实习僧 / 牛客
      note: 学生简历为主，附件 PDF 直接看，关键词命中影响推荐
      checks:
        length_one_page: 一页以内（学生简历超过一页，前两屏就被刷完）
        keywords_role: 技能用岗位词写（「SQL」不写「数据库语言」）
        sections_std: 教育、实习、项目、技能四块齐全
    liepin:
      label: 猎聘
      note: 中高端岗位为主，经历连续性看得比关键词重
      checks:
        dates_range: 起止年月连续，空档要有交代
        sections_std: 标准章节标题
        keywords_role: 岗位关键词与职级词（实习/校招）写清
    workday:
      label: Workday / Greenhouse（海外投递）
      note: 强结构化录入：日期格式、单栏、无页眉页脚
      checks:
        dates_fmt: 日期写成 MM/YYYY（09/2024），别写「2024年9月」
        layout_single: 单栏，无页眉页脚，无星级/评分条
        filename_en: 文件名用英文，不用中文和空格（Li_Lei_Resume.pdf）
        contact_top: 联系方式在正文首屏

# ---------------------------------------------------------------------------
# 评测与标注（v2.0 新增：可信度路线的验收门槛）
# ---------------------------------------------------------------------------
eval:
  # 目标数据集规模与 heldout 规模
  dataset_target: 60
  heldout_target: 18
  # 与人工评分的平均绝对误差上限（⚠️ v1 那个 8.0 是自我实现得出的代理值，
  # v2 必须用独立标注数据重测，不得继承旧值）
  mae_max: 8
  # repeat=3 时三次分数的极差上限（抖动控制）
  repeat_spread_max: 6
  # 两名标注者差距超过这个分就进仲裁队列
  arbitration_threshold: 15
  # 双人标注一致性门槛（Cohen's κ，四档 verdict）
  kappa_min: 0.6
  # 改稿闭环落实率：可判定改写至少这么多条才允许对外给百分比
  # 依据：3 次观察的 67% 会被当成结论；10 条以下波动过大（±1 条≈10 个点）
  closure_min_pairs: 10
  # pilot（先验证量表能不能用）门槛：双人评过 ≥5 份即可出「pilot 报告」。
  # pilot 只回答「两个人是不是在用同一把尺子」（κ/QWK），**不回答模型准不准**——
  # 5 份样本算 MAE 会被当结论，所以 pilot 报告里 MAE 只作为「有没有明显离谱」的参考。
  # 依据：κ 在 n=5 时标准误约 ±0.3，只能看出「接近随机」和「明显一致」，看不出 0.6 与 0.7 的差别。
  pilot_min_pairs: 5
  pilot_min_reviewers: 2
